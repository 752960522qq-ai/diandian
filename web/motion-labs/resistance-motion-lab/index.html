<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151c20"><title>抵抗军 · 动作实验室</title><meta name="description" content="两名抵抗军角色、完整基础动作与五种枪械的独立预览站。"><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./styles.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><main><aside class="panel"><header><span class="eyebrow">CHARACTER STUDIES / 03</span><h1>抵抗军<span>动作实验室</span></h1><p>从静止到行动，检查每一个姿态。</p></header>
<section><div class="section-title"><h2>角色</h2><span>01 — 02</span></div><div class="characters"><button data-character="military" class="active" aria-pressed="true"><span>01</span><strong>军装抵抗军</strong><small>MILITARY</small></button><button data-character="vest" aria-pressed="false"><span>02</span><strong>背心抵抗军</strong><small>MILITARY VEST</small></button></div></section>
<section><div class="section-title"><h2>装备</h2><span>9 种枪械</span></div><label class="sr-only" for="weapon">选择装备</label><select id="weapon"><option value="none">无装备 · 基础动作</option><option value="qbz95">QBZ95 自动步枪</option><option value="type56_1">56式（56-1）冲锋枪</option><option value="qbu85">QBU85 狙击步枪</option><option value="type97hawk">97式防暴霰弹枪</option><option value="qcq171">QCQ171 冲锋枪</option><option value="qsz92">QSZ92 精修手枪</option><option value="type54">54式 精修手枪</option><option value="type64">64式 独立手枪</option><option value="m870">M870 霰弹枪</option></select></section>
<section class="motion-section"><div class="section-title"><h2>动作</h2><span id="count"></span></div><div id="motions"></div></section>
<footer>独立角色测试站 <span>R48</span></footer></aside>
<section id="stage" aria-label="交互式三维角色预览"><canvas id="viewport"></canvas><div class="stage-top"><div><span class="status-dot"></span><span id="character-label">军装抵抗军</span><small id="equipment-label">无装备</small></div><span class="stage-tag">LIVE VIEW</span></div>
<div id="loading" role="status"><span class="spinner"></span><h2>正在准备角色</h2><p>首次加载需要一点时间</p></div>
<div class="view-tools"><button data-view="front" title="正面">正面</button><button data-view="side" title="侧面">侧面</button><button data-view="back" title="背面">背面</button><button id="closeup">近景</button><button id="skeleton" aria-pressed="false">骨骼</button></div>
<div class="player"><div class="player-title"><div><span class="eyebrow">CURRENT MOTION</span><h2 id="motion-label">待机</h2></div><span id="motion-en">IDLE</span></div><div class="timeline"><button id="play" aria-label="暂停">暂停</button><label class="sr-only" for="seek">动作进度</label><input id="seek" type="range" min="0" max="1" step="0.001" value="0"><output id="time">0.00 / 0.00</output><label class="sr-only" for="speed">播放速度</label><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></div><p class="hint">拖动旋转 · 滚轮缩放 · 右键平移</p></div>
</section></main><script type="module" src="./app.js?v=fix1110-stage41"></script></body></html>
